function originalValue(doc,c){if(c.css){const css=doc.querySelector('style')?.textContent||'';return css.match(new RegExp(c.css.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*:\\s*(#[0-9a-fA-F]{6})'))?.[1]||'#100b0d'}if(c.special)return (doc.querySelector('style')?.textContent||'').match(/url\("([^"\n]+)"\) center\/cover/)?.[1]||'';return doc.querySelector(c.selector)?.textContent?.trim()||''}
function isImageSource(value){return /^https:\/\//i.test(value||'')||/^data:image\/(?:png|jpeg|webp);base64,/i.test(value||'')}
async function optimizeImage(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG, PNG veya WebP seçmelisin.');
 if(file.size>15*1024*1024)throw Error('Görsel 15 MB üzerinde olamaz.');
 const blobUrl=URL.createObjectURL(file);
 try{
  const image=new Image();image.src=blobUrl;await image.decode();
  const scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Görsel işlenemedi.');
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  // JPEG conversion keeps the downloadable HTML compact; transparency uses PNG.
  const format=file.type==='image/png'?'image/png':'image/jpeg';
  let result=canvas.toDataURL(format,.78);
  if(result.length>2_000_000){result=canvas.toDataURL('image/jpeg',.65)}
  if(result.length>2_500_000)throw Error('Görsel çok büyük. Daha küçük bir görsel dene.');
  return result;
 }finally{URL.revokeObjectURL(blobUrl)}
}
function addImageControls(container,input,id){
 const row=document.createElement('div');row.className='rowbtn';
 const choose=document.createElement('button');choose.type='button';choose.className='secondary';choose.textContent='📁 Bilgisayardan seç';
 const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='Görseli kaldır';
 const picker=document.createElement('input');picker.type='file';picker.accept='image/jpeg,image/png,image/webp';picker.hidden=true;
 choose.onclick=()=>picker.click();
 picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;try{say('Görsel hazırlanıyor…');input.value=await optimizeImage(file);input.dispatchEvent(new Event('input',{bubbles:true}));say('Görsel önizlemeye eklendi. Yayımlamak için henüz HTML aktarımı gerekiyor.')}catch(e){say('Görsel yüklenemedi: '+e.message)}picker.value=''};
 remove.onclick=()=>{input.value='';input.dispatchEvent(new Event('input',{bubbles:true}))};
 row.append(choose,remove,picker);container.append(row);
 const note=document.createElement('p');note.className='tip';note.textContent='JPG, PNG veya WebP. Görsel HTML dosyasına gömülür. Otomatik yayımlama henüz bağlı değil.';container.append(note);
}

function build(){const doc=parse(source);let css=doc.querySelector('style')?.textContent||'';for(const c of config){const value=state[c.id];if(value===undefined)continue;if(c.css){const escaped=c.css.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');css=css.replace(new RegExp('('+escaped+'\\s*:\\s*)#[0-9a-fA-F]{6}'),(_,prefix)=>prefix+value)}else if(c.special==='heroimage'){if(isImageSource(value))css=css.replace(/(\.hero::before\{[^}]*?url\(")[^"]+("\))/s,(_,a,b)=>a+value+b)}else{const target=doc.querySelector(c.selector);if(target){if(c.id==='headline' && value===originalValue(parse(source),c)){/* Orijinal italik yapıyı koru */}else target.textContent=value}}}

function render(preserveScroll=true){
 const old=frame.contentDocument;
 const y=preserveScroll?old?.documentElement?.scrollTop||old?.body?.scrollTop||0:0;

 frame.onload=()=>{
  const d=frame.contentDocument;if(!d)return;
   // Yazı bağlantılarını gerçek sitenin kendi okuyucusu açar.
   d.addEventListener('click',e=>{
    if(e.target.closest('a[href^="#read/"]'))return;
   const a=e.target.closest('a');if(a)e.preventDefault();
   const c=config.find(c=>c.selector&&e.target.closest(c.selector));
   if(c){
    e.preventDefault();e.stopPropagation();switchTab('page');
    const field=document.getElementById(c.id);
    field?.focus();field?.scrollIntoView({block:'center',behavior:'smooth'});
    d.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));
    e.target.closest(c.selector).classList.add('selected');
    say('Seçildi: '+c.title);
   }
  },true);
  d.documentElement.scrollTop=y;d.body.scrollTop=y;
 };
 frame.srcdoc=working;
}
function extractEntries(src){const match=src.match(/const entries\s*=\s*(\[[\s\S]*?\]);(?=\s*const ordered)/);if(!match)return [];try{const data=JSON.parse(match[1]);return Array.isArray(data)?data:[]}catch{return []}}

function renderArticleFields(){const panel=document.getElementById('article-panel');panel.replaceChildren();const heading=document.createElement('h2');heading.textContent='Yazılar.';panel.append(heading);const note=document.createElement('p');note.className='hint';note.textContent='Yeni yazı ekle, seç, düzenle veya sil. Sağdaki önizleme anında güncellenir.';panel.append(note);const add=document.createElement('button');add.textContent='+ Yeni yazı';add.onclick=()=>{entries.unshift({id:'yazi-'+Date.now(),date:new Date().toISOString().slice(0,10),title:'Yeni yazı',excerpt:'',image:'',color:'#493039',body:['']});selectedEntry=0;renderArticleFields();render();say('Yeni yazı eklendi (henüz yayımlanmadı).')};panel.append(add);const list=document.createElement('div');list.className='entry-list';entries.forEach((e,i)=>{const b=document.createElement('button');b.className='entry-item'+(selectedEntry===i?' active':'');b.textContent=(e.title||'Başlıksız')+' · '+(e.date||'');b.onclick=()=>{selectedEntry=i;renderArticleFields()};list.append(b)});panel.append(list);if(selectedEntry<0||!entries[selectedEntry]){const n=document.createElement('p');n.className='empty-note';n.textContent=entries.length?'Düzenlemek için bir yazı seç.':'Henüz yazı yok. İlk yazını ekleyebilirsin.';panel.append(n);return}const e=entries[selectedEntry];const defs=[['title','Başlık','text'],['date','Yayın tarihi','date'],['excerpt','Kısa açıklama','textarea'],['image','Kapak görseli','image'],['color','Vurgu rengi','color'],['body','Yazının tamamı (paragrafları boş satırla ayır)','textarea']];for(const [key,label,type] of defs){const l=document.createElement('label');l.textContent=label;panel.append(l);const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=key==='body'?(e.body||[]).join('\n\n'):(e[key]||'');if(key==='body')input.style.minHeight='210px';input.addEventListener('input',()=>{e[key]=key==='body'?input.value.split(/\n\s*\n/):input.value;render()});panel.append(input);if(type==='image')addImageControls(panel,input,'article-image')}const buttons=document.createElement('div');buttons.className='rowbtn';const remove=document.createElement('button');remove.className='danger';remove.textContent='Yazıyı sil';remove.onclick=()=>{if(!confirm('Bu yazıyı taslaktan silmek istiyor musun?'))return;entries.splice(selectedEntry,1);selectedEntry=-1;renderArticleFields();render()};buttons.append(remove);panel.append(buttons)}

async function boot(){try{
 const response=await fetch('/index.html',{cache:'no-store'});
 if(!response.ok)throw Error('Ana sayfa okunamadı ('+response.status+')');
 const live=await response.text();
 source=journalTemplate();
 const liveEntries=extractEntries(live);
 entries=liveEntries.length?liveEntries:extractEntries(source);
 let recoveredFrom='';
 try{
  let raw=localStorage.getItem(KEY),saved=raw?JSON.parse(raw):null;
  if(!saved||!Array.isArray(saved.entries)||saved.entries.length===0){for(const legacyKey of LEGACY_KEYS){const oldRaw=localStorage.getItem(legacyKey);if(!oldRaw)continue;let candidate;try{candidate=JSON.parse(oldRaw)}catch{continue}if(Array.isArray(candidate.entries)&&candidate.entries.length){saved=candidate;recoveredFrom=legacyKey;break}}}
  if(saved){state=saved.state||{};if(Array.isArray(saved.entries)&&saved.entries.length){
    // Taslaktaki yeni yazıları koru, canlı sitedeki farklı yazıları da ekle.
    const known=new Set(saved.entries.map(e=>e.id));entries=[...saved.entries,...liveEntries.filter(e=>!known.has(e.id))];
  }}
 }catch{state={}}
 // Mevcut canlı sitedeki çiçekli açılış görselini mümkün olduğunca koru.
 if(!isImageSource(state.heroimage)){
  const liveImage=originalValue(parse(live),config.find(c=>c.id==='heroimage'));
  if(isImageSource(liveImage))state.heroimage=liveImage;
 }
 switchTab('page');render(false);
 say('Yeni yazı sergisi editörü hazır. Önce Yazılar sekmesinden yeni yazını kontrol et. Yayımla yalnızca kontrolünden sonra.');
 }catch(e){say('HATA: '+e.message);fields.innerHTML='';frame.removeAttribute('srcdoc')}}
document.getElementById('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify({state,entries}));say('Taslak bu tarayıcıda kaydedildi.')}catch(e){say('Tarayıcı depolama alanı doldu. HTML indir ile yedek al; görselleri küçültmeyi dene.')}};
document.getElementById('reload').onclick=()=>{render(false);say('Önizleme yenilendi.')};
document.getElementById('reset').onclick=()=>{if(!confirm('Taslağı sıfırlamak istiyor musun?'))return;localStorage.removeItem(KEY);state={};entries=extractEntries(source);selectedEntry=-1;switchTab(activeTab);render(false);say('Taslak sıfırlandı.')};
// GitHub OAuth: the existing Worker exchanges the code; token is kept in memory only.
const GITHUB_OWNER='zmey-archieve',GITHUB_REPO='tomreyes.journal';
const AUTH_ORIGIN='https://tomreyes-journal-auth.tomreyeda.workers.dev';
let githubToken=null;
function githubLogin(){
 return new Promise((resolve,reject)=>{
  const popup=window.open(AUTH_ORIGIN+'/auth','tomreyes-github-login','width=620,height=720');
  if(!popup){reject(Error('Giriş penceresi engellendi. Açılır pencerelere izin ver.'));return}
  let finished=false;
  const timer=setTimeout(()=>done(Error('GitHub girişi zaman aşımına uğradı.')),120000);
  const check=setInterval(()=>{if(popup.closed&&!finished)done(Error('GitHub giriş penceresi kapatıldı.'))},700);
  function done(error,token){if(finished)return;finished=true;clearTimeout(timer);clearInterval(check);window.removeEventListener('message',receive);if(error)reject(error);else resolve(token)}
  function receive(event){
   if(event.origin!==AUTH_ORIGIN||event.source!==popup)return;
   if(event.data==='authorizing:github'){
    popup.postMessage('authorizing:github',AUTH_ORIGIN);
    return;
   }
   const prefix='authorization:github:success:';
   if(typeof event.data==='string'&&event.data.startsWith(prefix)){
    try{const payload=JSON.parse(event.data.slice(prefix.length));if(!payload.token)throw Error('GitHub erişimi alınamadı.');done(null,payload.token)}catch(e){done(e)}
   }
  }
  window.addEventListener('message',receive);
 });
}
function encodeUTF8Base64(value){
 const bytes=new TextEncoder().encode(value);let binary='';
 for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
}
async function githubRequest(path,options={}){
 const response=await fetch('https://api.github.com'+path,{
  ...options,
  headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+githubToken,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw Error('GitHub '+response.status+': '+(result.message||'İşlem başarısız.'));
 return result;
}
document.getElementById('publish').onclick=async()=>{
 const button=document.getElementById('publish');
 if(button.disabled)return;
 if(!source||!working){say('Site henüz yüklenmedi.');return}
 if(!entries.length&&!confirm('Hiç yazı yok. Canlı sitedeki örnek yazıların tümünü kaldırmak istiyor musun?'))return;
 if(!confirm('TOMREYES.JOURNAL canlı sitesini bu önizlemeyle güncellemek istiyor musun?'))return;
 button.disabled=true;button.textContent='Yayımlanıyor…';
 try{
  // Save the draft first; never remove legacy backups.
  localStorage.setItem(KEY,JSON.stringify({state,entries}));
  if(!githubToken){say('GitHub girişi açılıyor…');githubToken=await githubLogin()}
  say('GitHub üzerindeki güncel dosya kontrol ediliyor…');
  const path='/repos/'+encodeURIComponent(GITHUB_OWNER)+'/'+encodeURIComponent(GITHUB_REPO)+'/contents/index.html';
  const existing=await githubRequest(path+'?ref=main');
  if(!existing.sha)throw Error('GitHub dosya sürümü bulunamadı.');
  // Rebuild using the newest current editor state.
  const output=build();
  if(!output.includes('const entries = '))throw Error('Yazılar site dosyasına işlenemedi. Yayımlama durduruldu.');
  say('Değişiklikler GitHub’a gönderiliyor…');
  const result=await githubRequest(path,{
   method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({message:'Publish TOMREYES.JOURNAL from visual editor',content:encodeUTF8Base64(output),sha:existing.sha,branch:'main'})
  });
  if(!result.commit?.sha)throw Error('GitHub kaydı doğrulanamadı.');
  source=output;working=output;
  say('GitHub’a kaydedildi! Cloudflare Pages dağıtımı tamamlanınca canlı site güncellenecek. Birkaç dakika sonra sayfayı yenile.');
 }catch(e){
  if(/401|403|Bad credentials|Resource not accessible/i.test(e.message||''))githubToken=null;
  say('Yayımlama tamamlanamadı: '+e.message+'\nTaslağın korunuyor; canlı site değişmedi veya GitHub sonucunu doğrulayamadık.');
 }finally{button.disabled=false;button.textContent='Yayımla'}
};
